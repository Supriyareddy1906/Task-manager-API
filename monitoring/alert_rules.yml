groups:
  - name: task-manager-alerts
    rules:
      - alert: AppDown
        expr: up{job="task-manager-app"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Task Manager API is down"
          description: "Prometheus can't scrape the app for 30s+."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[2m]) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate on Task Manager API"
          description: "More than 5% of requests are failing (over last 2m)."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High request latency"
          description: "95th percentile latency is above 1.5s."

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on host"
          description: "EC2 instance CPU usage above 80% for 2m+."
