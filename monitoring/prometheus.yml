global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # add alertmanager:9093 here if you add Alertmanager

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "task-manager-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
